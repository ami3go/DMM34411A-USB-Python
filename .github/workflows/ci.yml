name: Driver software CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and offline test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check dependency resolution
        run: python -m pip check
      - name: Syntax and critical lint checks
        run: |
          python -m compileall -q dmm34411a
          ruff check --select E4,E7,E9,F821,F822,F823 dmm34411a tests
      - name: Offline regression and minimum line coverage
        run: pytest -m "not hardware and not stress" --cov=dmm34411a --cov-report=term-missing --cov-fail-under=70
      - name: Check package build
        run: python -m build
      - name: Install built wheel and verify package import
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "import dmm34411a, importlib.metadata as m; assert dmm34411a.__version__ == m.version('dmm34411a-usb-python')"

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install simulator test dependencies
        run: python -m pip install -e ".[test]"
      - name: Offline bounded 1M-point binary and CSV stress
        run: pytest -m "stress and not hardware" -o timeout=180 --maxfail=1
